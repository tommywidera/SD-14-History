// ── Color functions ──────────────────────────────────────────────────────────
function getColor(pid) {
  const d = ED[pid]; if (!d || !d[cycle]) return 'rgba(180,180,190,0.5)';
  const r = d[cycle];
  if (metric === 'margin') {
    const diff = ((r.dem_pct || .5) - (r.rep_pct || .5)) * 100;
    if (diff >  15)  return 'rgba(10,60,130,0.82)';   // D+15.1%+   dark blue
    if (diff >   5)  return 'rgba(30,110,200,0.80)';  // D+5.1–15%  blue
    if (diff >   0)  return 'rgba(130,190,240,0.78)'; // D+0.1–5%   light blue
    if (diff > -5)   return 'rgba(240,160,150,0.78)'; // R+0.1–5%   light red
    if (diff > -15)  return 'rgba(210,50,40,0.80)';   // R+5.1–15%  red
    return             'rgba(130,10,10,0.82)';         // R+15.1%+   dark red
  }
  if (metric === 'turnout') {
    const t = (r.total_turnout || 0) * 100;
    // Per-cycle quintile breakpoints (computed from actual data)
    const breaks = {
      '2022': [46.5, 54.0, 62.1, 68.2],
      '2024': [77.3, 80.8, 85.4, 87.7],
      '2026': [20.3, 25.5, 29.0, 33.4]
    };
    const b = breaks[cycle] || [30, 45, 60, 75];
    if (t >= b[3]) return 'rgba(2,78,32,0.82)';    // darkest green  top 20%
    if (t >= b[2]) return 'rgba(10,120,50,0.80)';  // dark green
    if (t >= b[1]) return 'rgba(40,167,90,0.78)';  // normal green
    if (t >= b[0]) return 'rgba(120,210,140,0.76)';// light green
    return              'rgba(195,235,205,0.74)';   // faint green    bottom 20%
  }
  const v = r.dem_pct || .4;
  if (v > .65) return 'rgba(26,95,168,0.75)';
  if (v > .55) return 'rgba(58,128,200,0.75)';
  if (v > .50) return 'rgba(106,170,216,0.75)';
  if (v > .45) return 'rgba(154,192,224,0.75)';
  return 'rgba(100,120,138,0.65)';
}

function getEDColor(pid) {
  const cyData = ED_VOTER[pid] && ED_VOTER[pid][cycle];
  if (!cyData) return 'rgba(100,100,110,0.5)'; // gray = N/A
  
  // Which sub-layer?
  const subMetric = { ed_total:'total_ed_pct', ed_rep:'rep_ed_pct', ed_dem:'dem_ed_pct' }[edSub] || 'total_ed_pct';
  const metKey    = { ed_total:'total', ed_rep:'rep', ed_dem:'dem' }[edSub] || 'total';
  
  const val = cyData[subMetric];
  if (val == null) return 'rgba(100,100,110,0.5)'; // gray = N/A
  
  const b = (ED_BREAKS[cycle] || {})[metKey] || [15,20,25,30];
  const pct = val * 100;
  if (pct >= b[3]) return 'rgba(180,70,0,0.82)';   // darkest orange  top 20%
  if (pct >= b[2]) return 'rgba(225,110,20,0.80)';  // dark orange
  if (pct >= b[1]) return 'rgba(245,160,50,0.78)';  // normal orange
  if (pct >= b[0]) return 'rgba(250,205,130,0.76)'; // light orange
  return              'rgba(252,235,200,0.74)';      // faint orange   bottom 20%
}

function styleFn(feature) {
  const pid = normPid(feature.properties);
  const isSel = selLayer && selLayer.feature === feature;
  return {
    fillColor: (metric.startsWith('ed_')) ? getEDColor(pid) : getColor(pid),
    fillOpacity: isSel ? 0.90 : 0.72,
    color: isSel ? '#ffffff' : 'rgba(0,0,0,0.6)',
    weight: isSel ? 2.5 : 0.8,
    opacity: isSel ? 1 : 0.7
  };
}

// ── Precinct ID normalisation ────────────────────────────────────────────────
// The Hillsborough layer may store precinct as "101", "0101", "14-101", etc.
function normPid(props) {
  const raw = props.Precinct || props.PRECINCT || props.precinct ||
              props.PrecinctID || props.PRECINCT_ID || props.NAME ||
              props.name || props.PREC || '';
  const m = String(raw).match(/(\d+)$/);
  return m ? String(parseInt(m[1], 10)) : String(raw).trim();
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function isDem(r) {
  return ['harris','nathan','cruz'].some(n => (r.winner||'').toLowerCase().includes(n));
}
function pct(v) { return v == null ? '<span style="color:#1e2a38">—</span>' : (v*100).toFixed(1)+'%'; }
function num(v) { return v == null ? '<span style="color:#1e2a38">—</span>' : Math.round(v).toLocaleString(); }

// ── Tooltip ───────────────────────────────────────────────────────────────────
let ttEl = null;
function showTT(e, pid) {
  const d = ED[pid]; if (!d || !d[cycle]) return;
  const r = d[cycle], isD = isDem(r);
  const mPct = (r.dem_pct != null && r.rep_pct != null)
    ? (Math.abs(r.dem_pct - r.rep_pct)*100).toFixed(1) : '?';
  if (!ttEl) {
    ttEl = document.createElement('div');
    ttEl.style.cssText = 'position:fixed;background:#0a1520;border:1px solid #1e3040;color:#c0d8e8;font:11px "IBM Plex Sans",sans-serif;padding:6px 10px;border-radius:3px;pointer-events:none;z-index:9999;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.8)';
    document.body.appendChild(ttEl);
  }
  ttEl.innerHTML = `<b>Precinct ${pid}</b> &nbsp;·&nbsp; ${isD?'D':'R'} +${mPct}%${r.total_turnout != null ? ' &nbsp;·&nbsp; '+(r.total_turnout*100).toFixed(1)+'% turnout' : ''}`;
  ttEl.style.display = 'block';
  ttEl.style.left = (e.originalEvent.clientX + 14)+'px';
  ttEl.style.top  = (e.originalEvent.clientY - 10)+'px';
}
function hideTT() { if (ttEl) ttEl.style.display = 'none'; }

// ── Panel ─────────────────────────────────────────────────────────────────────
function renderPanel(pid, pinned) {
  const data = ED[pid]; if (!data) return;
  const r = data[cycle]; if (!r) return;
  const isD = isDem(r), wClass = isD?'wd':'wr', wIcon = isD?'▲':'▼';
  const wName = isD ? r.dem_name : r.rep_name;
  const dB = r.dem_pct != null ? (r.dem_pct*100).toFixed(1) : 50;
  const rB = r.rep_pct != null ? (r.rep_pct*100).toFixed(1) : 50;
  const mPct = (r.dem_pct != null && r.rep_pct != null) ? Math.abs(r.dem_pct - r.rep_pct)*100 : null;
  const mV = r.margin_votes, mP = isD?'D':'R', mC = isD?'mdc':'mrc';
  const mStr = mPct != null
    ? `${mP}+${mPct.toFixed(1)}% / ${mP}+${Math.round(mV||0).toLocaleString()} votes`
    : (mV != null ? `${mP}+${Math.round(mV).toLocaleString()} votes` : 'N/A');
  const cyL = {'2026':'2026 Special Election','2024':'2024 General Election','2022':'2022 General Election'}[cycle];

  // ED Voter info for panel
  const edD = ED_VOTER[pid] && ED_VOTER[pid][cycle];
  let edSection = '';
  if (metric.startsWith('ed_') && edD) {
    const fmt = v => v == null ? '<span style="color:#1e2a38">N/A</span>' : (v*100).toFixed(1)+'%';
    edSection = `<div class="ds"><div class="sl">Election Day Voters</div>
      <div class="vr"><div class="pd dd"></div><span class="pn">Dem ED voters</span><span class="vc">${num(edD.dem_ed)}</span><span class="vp dp">${fmt(edD.dem_ed_pct)}</span></div>
      <div class="vr"><div class="pd rd"></div><span class="pn">Rep ED voters</span><span class="vc">${num(edD.rep_ed)}</span><span class="vp rp">${fmt(edD.rep_ed_pct)}</span></div>
      <div class="mr"><span class="ml">Total ED / Total votes</span><span class="mv" style="color:#e16e14">${num(edD.total_ed)} / ${num(edD.total)} (${fmt(edD.total_ed_pct)})</span></div>
    </div>`;
  }
  let hist = '';
  ['2026','2024','2022'].forEach(c => {
    const cr = data[c]; if (!cr) return;
    const cD = isDem(cr);
    const cDp = cr.dem_pct != null ? (cr.dem_pct*100) : 50;
    const cRp = cr.rep_pct != null ? (cr.rep_pct*100) : 50;
    const cM  = (cr.dem_pct != null && cr.rep_pct != null) ? Math.abs(cr.dem_pct - cr.rep_pct)*100 : null;
    hist += `<div class="hr"><span class="hy">${c}</span>
      <div class="hbt"><div class="hbd" style="width:${cDp.toFixed(1)}%"></div><div class="hbr" style="width:${cRp.toFixed(1)}%"></div></div>
      <span class="hw ${cD?'d':'r'}">${cM != null ? `${cD?'D':'R'}+${cM.toFixed(1)}%` : (cr.winner||'?')}</span></div>`;
  });

  document.getElementById('pe').style.display = 'none';
  const pc = document.getElementById('pc');
  pc.style.cssText = 'display:flex;flex-direction:column';
  pc.innerHTML = `
    <div class="ph2">
      <div class="pt">Precinct ${pid}</div>
      <div class="pm">${cyL}${pinned?' · <span style="color:#2a4878">pinned</span>':''}</div>
      <div class="${wClass} wb">${wIcon} ${wName}</div>
    </div>
    <div class="ds"><div class="sl">Vote totals</div>
      <div class="vr"><div class="pd dd"></div><span class="pn">${r.dem_name||'Democrat'}</span><span class="vc">${num(r.dem_votes)}</span><span class="vp dp">${pct(r.dem_pct)}</span></div>
      <div class="bt"><div class="bdd" style="width:${dB}%"></div></div>
      <div class="vr"><div class="pd rd"></div><span class="pn">${r.rep_name||'Republican'}</span><span class="vc">${num(r.rep_votes)}</span><span class="vp rp">${pct(r.rep_pct)}</span></div>
      <div class="bt"><div class="brd" style="width:${rB}%"></div></div>
      <div class="mr"><span class="ml">Winner / Margin</span><span class="mv ${mC}">${mStr}</span></div>
    </div>
    <div class="ds"><div class="sl">Turnout</div>
      <div class="tg">
        <div class="tc"><div class="tl">Dem</div><div class="tv d">${pct(r.dem_turnout)}</div></div>
        <div class="tc"><div class="tl">Rep</div><div class="tv r">${pct(r.rep_turnout)}</div></div>
        <div class="tc"><div class="tl">Total</div><div class="tv">${pct(r.total_turnout)}</div></div>
      </div>
    </div>
    ${edSection}<div class="ds"><div class="sl">History</div>${hist}</div>`;
}

// ── Build Leaflet layer from GeoJSON ─────────────────────────────────────────
function buildLayer(geojson) {
  if (geoLayer) map.removeLayer(geoLayer);

  const filtered = {
    type: 'FeatureCollection',
    features: geojson.features.filter(f => SD14.has(normPid(f.properties)))
  };

  document.getElementById('hs').textContent =
    `Hillsborough County · ${filtered.features.length} precincts loaded · Hover or click any precinct`;
  document.getElementById('loading').style.display = 'none';

  geoLayer = L.geoJSON(filtered, {
    style: styleFn,
    onEachFeature(feature, layer) {
      const pid = normPid(feature.properties);
      layer.on('mouseover', e => {
        if (selLayer !== layer) layer.setStyle({ color:'#ccc', weight:1.5 });
        showTT(e, pid);
        if (!selLayer) renderPanel(pid, false);
      });
      layer.on('mousemove', e => showTT(e, pid));
      layer.on('mouseout', () => {
        if (selLayer !== layer) geoLayer.resetStyle(layer);
        hideTT();
        if (!selLayer) {
          document.getElementById('pe').style.display = 'flex';
          document.getElementById('pc').style.display = 'none';
        }
      });
      layer.on('click', () => {
        if (selLayer && selLayer !== layer) geoLayer.resetStyle(selLayer);
        selLayer = layer;
        layer.setStyle({ color:'#fff', weight:2.5, fillOpacity:0.90 });
        renderPanel(pid, true);
      });
    }
  }).addTo(map);

  try { map.fitBounds(geoLayer.getBounds(), { padding:[20,20] }); } catch(e){}
}

// ── Fetch from ArcGIS ─────────────────────────────────────────────────────────
// The item 0dc4f8f609e44160998cacb7b62f73f3 is hosted on Hillsborough's ArcGIS Online.
// We query the public FeatureServer REST endpoint, requesting only SD-14 precinct numbers.
// Multiple endpoint patterns tried in sequence for robustness.

const ITEM_ID = '0dc4f8f609e44160998cacb7b62f73f3';
const SD14_NUMS = Array.from(SD14);

// Build a WHERE clause filtering to just our 152 precincts
// The field might be Precinct, PRECINCT, PrecinctNum, etc. — we try a broad filter
// by using the numeric values and letting normPid sort it out client-side
const whereClause = encodeURIComponent("1=1"); // fetch all, filter client-side

const ENDPOINTS = [
  // Pattern 1: direct FeatureServer from item ID (ArcGIS Online hosted)
  `https://services2.arcgis.com/xRI2NLbn6qsxSS9X/arcgis/rest/services/Election_Geography/FeatureServer/1/query?where=${whereClause}&outFields=*&outSR=4326&f=geojson`,
  `https://services2.arcgis.com/xRI2NLbn6qsxSS9X/arcgis/rest/services/ElectionGeography/FeatureServer/1/query?where=${whereClause}&outFields=*&outSR=4326&f=geojson`,
  `https://services2.arcgis.com/xRI2NLbn6qsxSS9X/arcgis/rest/services/Election_Geography_Voting_Precincts/FeatureServer/0/query?where=${whereClause}&outFields=*&outSR=4326&f=geojson`,
  // Pattern 2: use the item ID directly as a feature service
  `https://hillsborough.maps.arcgis.com/sharing/rest/content/items/${ITEM_ID}/data?f=geojson`,
  // Pattern 3: Hillsborough org services with various names
  `https://services2.arcgis.com/xRI2NLbn6qsxSS9X/arcgis/rest/services/VotingPrecincts/FeatureServer/0/query?where=${whereClause}&outFields=*&outSR=4326&f=geojson`,
  `https://services2.arcgis.com/xRI2NLbn6qsxSS9X/arcgis/rest/services/Precincts/FeatureServer/0/query?where=${whereClause}&outFields=*&outSR=4326&f=geojson`,
];

function setLoadMsg(msg) {
  document.getElementById('load-detail').textContent = msg;
}

async function fetchPrecincts() {
  // First: try to resolve the actual service URL from the item ID
  // via the ArcGIS sharing API
  const itemUrl = `https://www.arcgis.com/sharing/rest/content/items/${ITEM_ID}?f=json`;
  try {
    setLoadMsg('Resolving service URL from item ID…');
    const res = await fetch(itemUrl);
    if (res.ok) {
      const meta = await res.json();
      if (meta.url) {
        // Got the actual feature service URL — query layer 1 (Voting Precincts)
        setLoadMsg(`Found service: ${meta.title || meta.url}`);
        for (const layerIdx of [1, 0, 2]) {
          const qUrl = `${meta.url.replace(/\/$/, '')}/${layerIdx}/query?where=1%3D1&outFields=*&outSR=4326&f=geojson`;
          try {
            const r2 = await fetch(qUrl);
            if (r2.ok) {
              const gj = await r2.json();
              if (gj.features && gj.features.length > 0) {
                buildLayer(gj); return;
              }
            }
          } catch(e) {}
        }
      }
    }
  } catch(e) {}

  // Fallback: try the known endpoint patterns
  for (let i = 0; i < ENDPOINTS.length; i++) {
    const url = ENDPOINTS[i];
    setLoadMsg(`Trying endpoint ${i+1} of ${ENDPOINTS.length}…`);
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const gj = await res.json();
      if (gj.features && gj.features.length > 0) {
        buildLayer(gj); return;
      }
    } catch(e) {}
  }

  // All endpoints failed — show instructions
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hs').textContent = 'Could not auto-load boundaries — see instructions below';
  showManualInstructions();
}

function showManualInstructions() {
  const div = document.createElement('div');
  div.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0a0e14;border:1px solid #1e2535;padding:20px 24px;border-radius:8px;z-index:2000;max-width:480px;font-size:12px;line-height:1.7;color:#8899aa';
  div.innerHTML = `
    <div style="font-size:14px;font-weight:600;color:#e8f0f8;margin-bottom:12px">Load GeoJSON Manually</div>
    <p style="margin-bottom:10px">The ArcGIS layer requires authentication from your browser. To load it:</p>
    <ol style="margin-left:16px;margin-bottom:14px;color:#6a8899">
      <li>Open <a href="https://hillsborough.maps.arcgis.com/apps/mapviewer/index.html?layerId=1&layers=0dc4f8f609e44160998cacb7b62f73f3" target="_blank" style="color:#7ab3e8">the ArcGIS map</a> in a new tab</li>
      <li>In the Layers panel, right-click <b>Election Geography - Voting Precincts</b></li>
      <li>Choose <b>View in attribute table</b> → then <b>Export → GeoJSON</b></li>
      <li>Upload the file below</li>
    </ol>
    <input type="file" id="gj-upload" accept=".geojson,.json" style="font-size:11px;color:#8899aa;width:100%;padding:6px;background:#0d1520;border:1px solid #1e2535;border-radius:3px;color:#c0d8e8">
    <div style="font-size:10px;color:#2a3a48;margin-top:8px">Or try: Open the map → click Export in the toolbar → Download as GeoJSON</div>`;
  document.getElementById('map').appendChild(div);

  document.getElementById('gj-upload').addEventListener('change', function(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const gj = JSON.parse(ev.target.result);
        div.remove();
        buildLayer(gj);
      } catch(err) { alert('Invalid GeoJSON file. Please try again.'); }
    };
    reader.readAsText(file);
  });
}

// ── Controls ──────────────────────────────────────────────────────────────────
document.getElementById('cb').addEventListener('click', e => {
  if (!e.target.matches('.btn')) return;
  cycle = e.target.dataset.cy;
  e.target.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  if (geoLayer) geoLayer.setStyle(styleFn);
  if (selLayer) { renderPanel(normPid(selLayer.feature.properties), true); selLayer.setStyle({color:'#fff',weight:2.5,fillOpacity:.90}); }
});

// ED sub-tab buttons
document.getElementById('ed-sub-btns').addEventListener('click', e => {
  if (!e.target.matches('.btn')) return;
  edSub = e.target.dataset.ed;
  e.target.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  if (geoLayer) geoLayer.setStyle(styleFn);
  updateLegend();
});

document.getElementById('mb').addEventListener('click', e => {
  if (!e.target.matches('.btn')) return;
  metric = e.target.dataset.mt;
  e.target.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  // Show ED sub-row only when in ED Voters mode
  const edSubRow = document.getElementById('ed-sub');
  if (metric.startsWith('ed_')) {
    edSubRow.style.display = 'flex';
    edSub = metric; // sync sub with selected tab
    // reset sub-buttons
    document.querySelectorAll('#ed-sub-btns .btn').forEach(b => {
      b.classList.toggle('active', b.dataset.ed === edSub);
    });
  } else {
    edSubRow.style.display = 'none';
  }
  if (geoLayer) geoLayer.setStyle(styleFn);
  updateLegend();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (geoLayer) try { map.fitBounds(geoLayer.getBounds(), {padding:[20,20]}); } catch(e){}
  else map.setView([28.01,-82.515], 11);
});

function updateLegend() {
  const edLabels = {ed_total:'ED Voters — All', ed_rep:'ED Voters — Rep', ed_dem:'ED Voters — Dem'};
  const T = {margin:'Party margin', turnout:'Total turnout', dem:'Dem vote share',
             ed_total:'ED Voters — All', ed_rep:'ED Voters — Rep Only', ed_dem:'ED Voters — Dem Only'};
  const B = {
    margin: 'linear-gradient(to right,#820a0a,#d23228,#f0a096,#82bef0,#1e6ec8,#0a3c82)',
    turnout:'linear-gradient(to right,#c3ebd0,#78d28c,#28a75a,#0a7832,#024e20)',
    dem:    'linear-gradient(to right,#6a7a8a,#9ac8e0,#4a90d9,#1a5fa8)',
    ed_total:'linear-gradient(to right,#fcebc8,#facb82,#f5a032,#e16e14,#b44600)',
    ed_rep:  'linear-gradient(to right,#fcebc8,#facb82,#f5a032,#e16e14,#b44600)',
    ed_dem:  'linear-gradient(to right,#fcebc8,#facb82,#f5a032,#e16e14,#b44600)'
  };
  const L = {margin:['REP','DEM'], turnout:['Low','High'], dem:['<45%','>65%'], ed_total:['Low %','High %'], ed_rep:['Low %','High %'], ed_dem:['Low %','High %']};
  document.getElementById('lt').textContent = T[metric];
  document.getElementById('lb').style.background = B[metric];
  document.getElementById('ll').textContent = L[metric][0];
  document.getElementById('lr').textContent = L[metric][1];
}

// Leaflet tooltip style
const s = document.createElement('style');
s.textContent = '.leaflet-tooltip{background:#0a1520!important;border:1px solid #1e3040!important;color:#c0d8e8!important;font-family:"IBM Plex Sans",sans-serif!important;font-size:11px!important;border-radius:3px!important}';
document.head.appendChild(s);

// Start fetching
fetchPrecincts();

// ── Panel collapse/expand ─────────────────────────────────────────────────────
const panelEl  = document.getElementById('panel');
const panelTab = document.getElementById('panel-tab');
let panelOpen  = true;

panelTab.addEventListener('click', () => {
  panelOpen = !panelOpen;
  panelEl.classList.toggle('collapsed', !panelOpen);
  panelTab.innerHTML = panelOpen ? '&#9654;' : '&#9664;';
  panelTab.title = panelOpen ? 'Hide results panel' : 'Show results panel';
  setTimeout(() => map.invalidateSize(), 280);
});
</script>
