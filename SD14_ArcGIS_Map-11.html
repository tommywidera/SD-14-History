*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#111;font-family:'IBM Plex Sans',sans-serif;color:#f0f0f0}
#app{display:flex;flex-direction:column;height:100%}
#hdr{background:#0d1117;border-bottom:1px solid #1e2535;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;flex-shrink:0;z-index:1000}
.ht{font-size:14px;font-weight:600;color:#fff}
.hs{font-size:10px;color:#90afc0;font-family:'IBM Plex Mono',monospace;margin-top:1px}
.controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.cg{display:flex;gap:3px}
.btn{font-size:11px;padding:4px 10px;border:1px solid #1e2a38;border-radius:3px;background:transparent;color:#9fbfcc;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .12s}
.btn:hover{border-color:#4a7090;color:#c0dce8}
.btn.active{background:#0d1a28;border-color:#2a4878;color:#dde8f4}
.btn.y26.active{border-color:#4a90d9;color:#7ab3e8;background:#061525}
.btn.y24.active{border-color:#d9604a;color:#e8896b;background:#1a0a06}
.btn.y22.active{border-color:#5aaa70;color:#7acc88;background:#061a0c}
.btn.y20.active{border-color:#c8a020;color:#e8c040;background:#1a1400}
.btn.y18.active{border-color:#b060c8;color:#d090e8;background:#180828}
.sep{width:1px;height:18px;background:#1e2535}
#body{flex:1;display:flex;overflow:hidden;min-height:0}
#map{flex:1;z-index:1}
#panel{width:295px;flex:0 0 295px;background:#0a0e14;border-left:1px solid #151e2a;overflow-y:auto;display:flex;flex-direction:column;z-index:200;transition:width 0.25s ease,flex-basis 0.25s ease}
#panel.collapsed{width:0;flex:0 0 0;overflow:hidden;border-left:none}
#panel-tab{flex-shrink:0;width:20px;background:#0a0e14;border:none;border-left:1px solid #151e2a;border-top:none;border-right:none;border-bottom:none;cursor:pointer;color:#4a6070;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:201;transition:color 0.15s,background 0.15s;padding:0;outline:none}
#panel-tab:hover{color:#7ab3e8;background:#0d1520}
@media(max-width:700px){
  #body{position:relative}
  #panel{position:absolute;right:0;top:0;bottom:0;z-index:500;box-shadow:-4px 0 20px rgba(0,0,0,0.6);flex:none}
  #panel.collapsed{width:0;overflow:hidden}
  #panel-tab{position:absolute;right:0;top:50%;transform:translateY(-50%);width:28px;height:56px;border-radius:6px 0 0 6px;border:1px solid #151e2a;z-index:501}
  #panel.collapsed ~ #panel-tab, #panel-tab{right:0}
}
.pe{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4a6070;text-align:center;padding:20px;gap:10px}
.pe p{font-size:11px;line-height:1.6;color:#5a7080}
#pc{display:none;flex-direction:column}
.ph2{padding:12px 14px 10px;border-bottom:1px solid #111820}
.pt{font-size:15px;font-weight:600;color:#e8f0f8}
.pm{font-size:10px;color:#90afc0;font-family:'IBM Plex Mono',monospace;margin-top:2px}
.wb{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:2px;font-size:10px;font-weight:600;margin-top:6px;letter-spacing:.05em;text-transform:uppercase}
.wd{background:#061525;color:#6aa8e0;border:1px solid #0d2840}
.wr{background:#1a0808;color:#e08060;border:1px solid #400c0c}
.ds{padding:10px 14px;border-bottom:1px solid #0d1318}
.sl{font-size:9px;font-weight:600;color:#9ab8c8;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.vr{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.pd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dd{background:#4a90d9}.rd{background:#d9604a}
.pn{font-size:11px;color:#a8c4d0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#bccedd;text-align:right;min-width:44px}
.vp{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;min-width:40px;text-align:right}
.dp{color:#6aa8e0}.rp{color:#e08060}

.tv{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:#b0ccda}
.tv.d{color:#6aa8e0}.tv.r{color:#e08060}
.hr{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #0d1318}
.hr:last-child{border-bottom:none}
.hy{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#90b0c0;width:28px;flex-shrink:0}

.lb{width:100%;height:5px;border-radius:3px}

// ── Color functions ──────────────────────────────────────────────────────────
function getColor(pid) {
  const d = ED[pid]; if (!d || !d[cycle]) return 'rgba(180,180,190,0.5)';
  const r = d[cycle];
  if (metric === 'margin') {
    const diff = ((r.dem_pct || .5) - (r.rep_pct || .5)) * 100;
    if (diff >  15)  return 'rgba(10,60,130,0.82)';   // D+15.1%+   dark blue
    if (diff >   5)  return 'rgba(30,110,200,0.80)';  // D+5.1–15%  blue
    if (diff >   0)  return 'rgba(130,190,240,0.78)'; // D+0.1–5%   light blue
    if (diff > -5)   return 'rgba(240,160,150,0.78)'; // R+0.1–5%   light red
    if (diff > -15)  return 'rgba(210,50,40,0.80)';   // R+5.1–15%  red
    return             'rgba(130,10,10,0.82)';         // R+15.1%+   dark red
  }
  if (metric === 'turnout') {
    // turnoutSub: 'total', 'dem', 'rep', 'npa'
    const tKey = {total:'total_turnout', dem:'dem_to', rep:'rep_to', npa:'npa_to'}[turnoutSub] || 'total_turnout';
    // Grab from ED for total/dem/rep_to, or from DEMO for npa
    let tval = null;
    if (tKey === 'total_turnout') tval = r.total_turnout;
    else if (tKey === 'dem_to') tval = r.dem_to != null ? r.dem_to : (DEMO[cycle]&&DEMO[cycle][pid] ? DEMO[cycle][pid].dem_to : null);
    else if (tKey === 'rep_to') tval = r.rep_to != null ? r.rep_to : (DEMO[cycle]&&DEMO[cycle][pid] ? DEMO[cycle][pid].rep_to : null);
    else if (tKey === 'npa_to') tval = r.npa_to != null ? r.npa_to : (DEMO[cycle]&&DEMO[cycle][pid] ? DEMO[cycle][pid].npa_to : null);
    if (tval == null) return 'rgba(100,100,110,0.5)';
    const t = tval * 100;
    const bKey = {total:'total_to', dem:'dem_to', rep:'rep_to', npa:'npa_to'}[turnoutSub] || 'total_to';
    const b = (BREAKS[cycle] || {})[bKey];
    if (!b) {
      // Fallback hardcoded
      if (t >= 75) return 'rgba(2,78,32,0.82)';
      if (t >= 55) return 'rgba(10,120,50,0.80)';
      if (t >= 40) return 'rgba(40,167,90,0.78)';
      if (t >= 25) return 'rgba(120,210,140,0.76)';
      return 'rgba(195,235,205,0.74)';
    }
    const bv = b.map(x=>x*100);
    if (t >= bv[3]) return 'rgba(2,78,32,0.82)';
    if (t >= bv[2]) return 'rgba(10,120,50,0.80)';
    if (t >= bv[1]) return 'rgba(40,167,90,0.78)';
    if (t >= bv[0]) return 'rgba(120,210,140,0.76)';
    return              'rgba(195,235,205,0.74)';
  }
  const v = r.dem_pct || .4;
  if (v > .65) return 'rgba(26,95,168,0.75)';
  if (v > .55) return 'rgba(58,128,200,0.75)';
  if (v > .50) return 'rgba(106,170,216,0.75)';
  if (v > .45) return 'rgba(154,192,224,0.75)';
  return 'rgba(100,120,138,0.65)';
}

function getEDColor(pid) {
  const cyData = ED_VOTER[pid] && ED_VOTER[pid][cycle];
  if (!cyData) return 'rgba(100,100,110,0.5)';
  const subMetric = { ed_total:'total_ed_pct', ed_rep:'rep_ed_pct', ed_dem:'dem_ed_pct' }[edSub] || 'total_ed_pct';
  const metKey    = { ed_total:'total', ed_rep:'rep', ed_dem:'dem' }[edSub] || 'total';
  const val = cyData[subMetric];
  if (val == null) return 'rgba(100,100,110,0.5)';
  const b = (ED_BREAKS[cycle] || {})[metKey] || [15,20,25,30];
  const pct = val * 100;
  if (pct >= b[3]) return 'rgba(180,70,0,0.82)';
  if (pct >= b[2]) return 'rgba(225,110,20,0.80)';
  if (pct >= b[1]) return 'rgba(245,160,50,0.78)';
  if (pct >= b[0]) return 'rgba(250,205,130,0.76)';
  return              'rgba(252,235,200,0.74)';
}

// Quintile color helper
function quintileColor(val, breaks, colors5) {
  if (val == null) return 'rgba(100,100,110,0.5)';
  const b = breaks || [0.2,0.4,0.6,0.8];
  if (val >= b[3]) return colors5[4];
  if (val >= b[2]) return colors5[3];
  if (val >= b[1]) return colors5[2];
  if (val >= b[0]) return colors5[1];
  return colors5[0];
}

const BROWN5 = [
  'rgba(240,220,195,0.75)',  // faint brown
  'rgba(205,165,115,0.77)',  // light brown
  'rgba(160,110,60,0.79)',   // normal brown
  'rgba(110,65,20,0.81)',    // dark brown
  'rgba(65,30,5,0.83)',      // darkest brown
];
const PURPLE5 = [
  'rgba(230,215,245,0.75)',  // faintest purple
  'rgba(185,155,220,0.77)',  // light purple
  'rgba(135,95,195,0.79)',   // normal purple
  'rgba(90,45,160,0.81)',    // dark purple
  'rgba(50,10,110,0.83)',    // darkest purple
];

function getRaceColor(pid) {
  const demoKey = { race_white:'white_to', race_black:'black_to', race_hisp:'hisp_to', race_other:'other_race_to' }[raceSub] || 'white_to';
  const cyDemo = DEMO[cycle] && DEMO[cycle][pid];
  if (!cyDemo) return 'rgba(100,100,110,0.5)';
  const val = cyDemo[demoKey];
  const b = (BREAKS[cycle] || {})[demoKey];
  return quintileColor(val, b, BROWN5);
}

function getGenderColor(pid) {
  const demoKey = { gender_male:'male_to', gender_female:'female_to' }[genderSub] || 'male_to';
  const cyDemo = DEMO[cycle] && DEMO[cycle][pid];
  if (!cyDemo) return 'rgba(100,100,110,0.5)';
  const val = cyDemo[demoKey];
  const b = (BREAKS[cycle] || {})[demoKey];
  return quintileColor(val, b, PURPLE5);
}

function styleFn(feature) {
  const pid = normPid(feature.properties);
  const isSel = selLayer && selLayer.feature === feature;
  const fillC = metric.startsWith('ed_') ? getEDColor(pid)
    : metric.startsWith('race_') ? getRaceColor(pid)
    : metric.startsWith('gender_') ? getGenderColor(pid)
    : getColor(pid);
  return {
    fillColor: fillC,
    fillOpacity: isSel ? 0.90 : 0.72,
    color: isSel ? '#ffffff' : 'rgba(0,0,0,0.6)',
    weight: isSel ? 2.5 : 0.8,
    opacity: isSel ? 1 : 0.7
  };
}

// ── Precinct ID normalisation ────────────────────────────────────────────────
// The Hillsborough layer may store precinct as "101", "0101", "14-101", etc.
function normPid(props) {
  const raw = props.Precinct || props.PRECINCT || props.precinct ||
              props.PrecinctID || props.PRECINCT_ID || props.NAME ||
              props.name || props.PREC || '';
  const m = String(raw).match(/(\d+)$/);
  return m ? String(parseInt(m[1], 10)) : String(raw).trim();
}

  const w = (r.winner||'').toLowerCase(); return ['harris','nathan','cruz','biden'].some(n => w.includes(n));

function num(v) { return v == null ? '<span style="color:#6a8898">—</span>' : Math.round(v).toLocaleString(); }

          <span class="vp" style="color:#c8a878;${bold}">${fmtPct(rc.to)}</span>
        </div>`;
      }).join('');
      raceSection = `<div class="ds"><div class="sl">Race Turnout</div>${rows}
        <div class="mr"><span class="ml">Total voted / eligible</span>
          <span class="mv" style="color:#c8a060">${fmtN(dm.total_voted)} / ${fmtN(dm.total_elig)} (${fmtPct(dm.total_to)})</span>
        </div></div>`;
    }

    if (metric.startsWith('gender_') && dm) {
      const activeGender = { gender_male:'Male', gender_female:'Female' }[metric];
      const genders = [
        { label:'Male',   clr:'#9060c8', voted: dm.male_voted,   elig: dm.male_elig,   to: dm.male_to },
        { label:'Female', clr:'#c060a0', voted: dm.female_voted, elig: dm.female_elig, to: dm.female_to },
      ];
      let grows = genders.map(g => {
        const isActive = g.label === activeGender;
        const bold = isActive ? 'font-weight:600;' : '';
        const bg   = isActive ? 'background:#120a1a;border-radius:3px;' : '';
        return `<div class="vr" style="${bg}padding:2px 4px;margin:1px 0">
          <div class="pd" style="background:${g.clr};border-radius:2px;width:8px;height:8px;flex-shrink:0"></div>
          <span class="pn" style="${bold}color:#c0a0d8">${g.label}</span>
          <span class="vc">${fmtN(g.voted)} / ${fmtN(g.elig)}</span>
          <span class="vp" style="color:#c0a0d8;${bold}">${fmtPct(g.to)}</span>
        </div>`;
      }).join('');
      raceSection = `<div class="ds"><div class="sl">Gender Turnout</div>${grows}
        <div class="mr"><span class="ml">Total voted / eligible</span>
          <span class="mv" style="color:#a080c8">${fmtN(dm.total_voted)} / ${fmtN(dm.total_elig)} (${fmtPct(dm.total_to)})</span>
        </div></div>`;
    }
  }

  let hist = '';
  ['2026','2024','2022','2020','2018'].forEach(c => {
    const cr = data[c]; if (!cr) return;
    const cD = ['harris','nathan','cruz','biden'].some(n => (cr.winner||'').toLowerCase().includes(n));
    const cDp = cr.dem_pct != null ? (cr.dem_pct*100) : 50;
    const cRp = cr.rep_pct != null ? (cr.rep_pct*100) : 50;
    const cM  = (cr.dem_pct != null && cr.rep_pct != null) ? Math.abs(cr.dem_pct - cr.rep_pct)*100 : null;
    hist += `<div class="hr"><span class="hy">${c}</span>
      <div class="hbt"><div class="hbd" style="width:${cDp.toFixed(1)}%"></div><div class="hbr" style="width:${cRp.toFixed(1)}%"></div></div>
      <span class="hw ${cD?'d':'r'}">${cM != null ? `${cD?'D':'R'}+${cM.toFixed(1)}%` : (cr.winner||'?')}</span></div>`;
  });

  document.getElementById('pe').style.display = 'none';
  const pc = document.getElementById('pc');
  pc.style.cssText = 'display:flex;flex-direction:column';
  pc.innerHTML = `
    <div class="ph2">
      <div class="pt">Precinct ${pid}</div>
      <div class="pm">${cyL}${pinned?' · <span style="color:#5a88c8">pinned</span>':''}</div>
      <div class="${wClass} wb">${wIcon} ${wName}</div>
    </div>
    <div class="ds"><div class="sl">Vote totals</div>
      <div class="vr"><div class="pd dd"></div><span class="pn">${r.dem_name||'Democrat'}</span><span class="vc">${num(r.dem_votes)}</span><span class="vp dp">${pct(r.dem_pct)}</span></div>
      <div class="bt"><div class="bdd" style="width:${dB}%"></div></div>
      <div class="vr"><div class="pd rd"></div><span class="pn">${r.rep_name||'Republican'}</span><span class="vc">${num(r.rep_votes)}</span><span class="vp rp">${pct(r.rep_pct)}</span></div>
      <div class="bt"><div class="brd" style="width:${rB}%"></div></div>
      <div class="mr"><span class="ml">Winner / Margin</span><span class="mv ${mC}">${mStr}</span></div>
    </div>
    <div class="ds"><div class="sl">Turnout</div>
      <div class="tg" style="grid-template-columns:1fr 1fr 1fr 1fr">
        <div class="tc"><div class="tl">Dem</div><div class="tv d">${pct(r.dem_to != null ? r.dem_to : (DEMO[cycle]&&DEMO[cycle][pid] ? DEMO[cycle][pid].dem_to : null))}</div></div>
        <div class="tc"><div class="tl">Rep</div><div class="tv r">${pct(r.rep_to != null ? r.rep_to : (DEMO[cycle]&&DEMO[cycle][pid] ? DEMO[cycle][pid].rep_to : null))}</div></div>
        <div class="tc"><div class="tl">NPA</div><div class="tv" style="color:#c8a040">${pct(r.npa_to != null ? r.npa_to : (DEMO[cycle]&&DEMO[cycle][pid] ? DEMO[cycle][pid].npa_to : null))}</div></div>
        <div class="tc"><div class="tl">Total</div><div class="tv">${pct(r.total_turnout)}</div></div>
      </div>
    </div>
    ${edSection}${raceSection}<div class="ds"><div class="sl">History</div>${hist}</div>`;
}

// ── Build Leaflet layer from GeoJSON ─────────────────────────────────────────
function buildLayer(geojson) {
  if (geoLayer) map.removeLayer(geoLayer);

  const filtered = {
    type: 'FeatureCollection',
    features: geojson.features.filter(f => SD14.has(normPid(f.properties)))
  };

  document.getElementById('hs').textContent =
    `Hillsborough County · ${filtered.features.length} precincts loaded · Hover or click any precinct`;
  document.getElementById('loading').style.display = 'none';

  geoLayer = L.geoJSON(filtered, {
    style: styleFn,
    onEachFeature(feature, layer) {
      const pid = normPid(feature.properties);
      layer.on('mouseover', e => {
        if (selLayer !== layer) layer.setStyle({ color:'#ccc', weight:1.5 });
        showTT(e, pid);
        if (!selLayer) renderPanel(pid, false);
      });
      layer.on('mousemove', e => showTT(e, pid));
      layer.on('mouseout', () => {
        if (selLayer !== layer) geoLayer.resetStyle(layer);
        hideTT();
        if (!selLayer) {
          document.getElementById('pe').style.display = 'flex';
          document.getElementById('pc').style.display = 'none';
        }
      });
      layer.on('click', () => {
        if (selLayer && selLayer !== layer) geoLayer.resetStyle(selLayer);
        selLayer = layer;
        layer.setStyle({ color:'#fff', weight:2.5, fillOpacity:0.90 });
        renderPanel(pid, true);
      });
    }
  }).addTo(map);

  try { map.fitBounds(geoLayer.getBounds(), { padding:[20,20] }); } catch(e){}
  buildLabels();
}


// ── Precinct number labels ─────────────────────────────────────────────────
function buildLabels() {
  if (labelLayer) map.removeLayer(labelLayer);
  labelLayer = L.layerGroup();

  geoLayer.eachLayer(function(layer) {
    const pid = normPid(layer.feature.properties);
    if (!ED[pid]) return;

    // Get centroid of this precinct polygon
    let center;
    try {
      center = layer.getBounds().getCenter();
    } catch(e) { return; }

    const icon = L.divIcon({
      className: 'precinct-label',
      html: `<span>${pid}</span>`,
      iconSize: [28, 12],
      iconAnchor: [14, 6]
    });

    const marker = L.marker(center, { icon: icon, interactive: false, zIndexOffset: -1000 });
    labelLayer.addLayer(marker);
  });

  // Only show labels at zoom >= 12
  function updateLabelVisibility() {
    const z = map.getZoom();
    if (z >= 12) {
      if (!map.hasLayer(labelLayer)) map.addLayer(labelLayer);
    } else {
      if (map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
    }
  }
  map.on('zoomend', updateLabelVisibility);
  updateLabelVisibility();
}

// ── Fetch from ArcGIS ─────────────────────────────────────────────────────────
// The item 0dc4f8f609e44160998cacb7b62f73f3 is hosted on Hillsborough's ArcGIS Online.
// We query the public FeatureServer REST endpoint, requesting only SD-14 precinct numbers.
// Multiple endpoint patterns tried in sequence for robustness.

const ITEM_ID = '0dc4f8f609e44160998cacb7b62f73f3';
const SD14_NUMS = Array.from(SD14);

// Build a WHERE clause filtering to just our 152 precincts
// The field might be Precinct, PRECINCT, PrecinctNum, etc. — we try a broad filter
// by using the numeric values and letting normPid sort it out client-side
const whereClause = encodeURIComponent("1=1"); // fetch all, filter client-side

const ENDPOINTS = [
  // Pattern 1: direct FeatureServer from item ID (ArcGIS Online hosted)
  `https://services2.arcgis.com/xRI2NLbn6qsxSS9X/arcgis/rest/services/Election_Geography/FeatureServer/1/query?where=${whereClause}&outFields=*&outSR=4326&f=geojson`,
  `https://services2.arcgis.com/xRI2NLbn6qsxSS9X/arcgis/rest/services/ElectionGeography/FeatureServer/1/query?where=${whereClause}&outFields=*&outSR=4326&f=geojson`,
  `https://services2.arcgis.com/xRI2NLbn6qsxSS9X/arcgis/rest/services/Election_Geography_Voting_Precincts/FeatureServer/0/query?where=${whereClause}&outFields=*&outSR=4326&f=geojson`,
  // Pattern 2: use the item ID directly as a feature service
  `https://hillsborough.maps.arcgis.com/sharing/rest/content/items/${ITEM_ID}/data?f=geojson`,
  // Pattern 3: Hillsborough org services with various names
  `https://services2.arcgis.com/xRI2NLbn6qsxSS9X/arcgis/rest/services/VotingPrecincts/FeatureServer/0/query?where=${whereClause}&outFields=*&outSR=4326&f=geojson`,
  `https://services2.arcgis.com/xRI2NLbn6qsxSS9X/arcgis/rest/services/Precincts/FeatureServer/0/query?where=${whereClause}&outFields=*&outSR=4326&f=geojson`,
];

function setLoadMsg(msg) {
  document.getElementById('load-detail').textContent = msg;
}

async function fetchPrecincts() {
  // First: try to resolve the actual service URL from the item ID
  // via the ArcGIS sharing API
  const itemUrl = `https://www.arcgis.com/sharing/rest/content/items/${ITEM_ID}?f=json`;
  try {
    setLoadMsg('Resolving service URL from item ID…');
    const res = await fetch(itemUrl);
    if (res.ok) {
      const meta = await res.json();
      if (meta.url) {
        // Got the actual feature service URL — query layer 1 (Voting Precincts)
        setLoadMsg(`Found service: ${meta.title || meta.url}`);
        for (const layerIdx of [1, 0, 2]) {
          const qUrl = `${meta.url.replace(/\/$/, '')}/${layerIdx}/query?where=1%3D1&outFields=*&outSR=4326&f=geojson`;
          try {
            const r2 = await fetch(qUrl);
            if (r2.ok) {
              const gj = await r2.json();
              if (gj.features && gj.features.length > 0) {
                buildLayer(gj); return;
              }
            }
          } catch(e) {}
        }
      }
    }
  } catch(e) {}

  // Fallback: try the known endpoint patterns
  for (let i = 0; i < ENDPOINTS.length; i++) {
    const url = ENDPOINTS[i];
    setLoadMsg(`Trying endpoint ${i+1} of ${ENDPOINTS.length}…`);
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const gj = await res.json();
      if (gj.features && gj.features.length > 0) {
        buildLayer(gj); return;
      }
    } catch(e) {}
  }

  // All endpoints failed — show instructions
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hs').textContent = 'Could not auto-load boundaries — see instructions below';
  showManualInstructions();
}

function showManualInstructions() {
  const div = document.createElement('div');
  div.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0a0e14;border:1px solid #1e2535;padding:20px 24px;border-radius:8px;z-index:2000;max-width:480px;font-size:12px;line-height:1.7;color:#8899aa';
  div.innerHTML = `
    <div style="font-size:14px;font-weight:600;color:#e8f0f8;margin-bottom:12px">Load GeoJSON Manually</div>
    <p style="margin-bottom:10px">The ArcGIS layer requires authentication from your browser. To load it:</p>
    <ol style="margin-left:16px;margin-bottom:14px;color:#6a8899">
      <li>Open <a href="https://hillsborough.maps.arcgis.com/apps/mapviewer/index.html?layerId=1&layers=0dc4f8f609e44160998cacb7b62f73f3" target="_blank" style="color:#7ab3e8">the ArcGIS map</a> in a new tab</li>
      <li>In the Layers panel, right-click <b>Election Geography - Voting Precincts</b></li>
      <li>Choose <b>View in attribute table</b> → then <b>Export → GeoJSON</b></li>
      <li>Upload the file below</li>
    </ol>
    <input type="file" id="gj-upload" accept=".geojson,.json" style="font-size:11px;color:#8899aa;width:100%;padding:6px;background:#0d1520;border:1px solid #1e2535;border-radius:3px;color:#c0d8e8">
    <div style="font-size:10px;color:#90b0c0;margin-top:8px">Or try: Open the map → click Export in the toolbar → Download as GeoJSON</div>`;
  document.getElementById('map').appendChild(div);

  document.getElementById('gj-upload').addEventListener('change', function(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const gj = JSON.parse(ev.target.result);
        div.remove();
        buildLayer(gj);
      } catch(err) { alert('Invalid GeoJSON file. Please try again.'); }
    };
    reader.readAsText(file);
  });
}
